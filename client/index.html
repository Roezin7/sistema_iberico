<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1e1e20" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>NODO</title>

    <!-- Tipografía: UI fuerte (Hanken Grotesk), cuerpo (Inter), datos (IBM Plex Mono), wordmark (Cormorant) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Cormorant+Garamond:wght@500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Resuelve el tema antes de pintar para evitar parpadeo claro/oscuro -->
    <script>
      (function () {
        try {
          var guardado = localStorage.getItem('iberico-tema');
          var tema = guardado || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.dataset.tema = tema;
        } catch (e) {
          document.documentElement.dataset.tema = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div id="boot-fallback" role="status">
        <strong>Ibérico</strong>
        <span>Cargando la aplicación…</span>
        <a href="/">Recargar</a>
      </div>
    </div>
    <style>
      #boot-fallback { min-height: 100vh; display: grid; place-content: center; gap: .65rem; padding: 2rem; box-sizing: border-box; color: #e9e7e2; background: #151311; font: 500 1rem/1.4 Inter, system-ui, sans-serif; text-align: center; }
      #boot-fallback strong { font: 600 2rem/1 Cormorant Garamond, Georgia, serif; }
      #boot-fallback span { color: #a8a39b; font-size: .9rem; }
      #boot-fallback a { color: #e5a7a0; font-size: .85rem; text-decoration: underline; }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
