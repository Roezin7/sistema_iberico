name: Calidad
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: iberico_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/iberico_ci_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run typecheck -w client
      # El contrato de inicio valida también los archivos reales de la PWA.
      - run: npm run build
      - run: npm test
      - run: npx -w server prisma migrate deploy
      - run: npx tsx server/scripts/verificar-cronologia-zonas.ts
      - run: npx tsx server/scripts/verificar-ciclo-inventario.ts
      - run: npx tsx server/scripts/verificar-trazabilidad-cierre.ts
      - run: npx tsx server/scripts/verificar-integridad-aplicacion.ts
      - run: npx tsx server/scripts/verificar-decimales-fifo.ts
      - run: npx tsx server/scripts/verificar-conteo-presentaciones.ts
